name: CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main, feature/* ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run deptry
        run: poetry run deptry . --per-rule-ignores 'DEP001=ai|config|email_clients|accounts_config|account_processor|email_fetcher|json_email_fetcher|util'

      - name: Run mypy
        run: poetry run mypy --strict src/

      - name: Run pytest
        run: poetry run pytest -o addopts='--no-header -q --cov=src --cov-report=term-missing' tests/unit/ tests/integration/ -m 'not live'
