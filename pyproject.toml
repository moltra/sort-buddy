[tool.poetry]
name = "sort-buddy"
version = "0.1.0"
description = ""
authors = ["Scott Lindsey <scott@scott.to>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
openai = "^1.26.0"
python-dotenv = "^1.0.1"
imapclient = "^3.0.1"
beautifulsoup4 = "^4.12.3"
lxml = "^5.2.1"
colorama = "^0.4.6"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
pyyaml = "^6.0"
loguru = "^0.7.0"

[tool.poetry.group.test.dependencies]
pytest = "^7.0.0"
pytest-mock = "^3.10.0"
pytest-cov = "^4.0.0"
pytest-socket = "^0.6.0"

[tool.poetry.group.dev.dependencies]
mypy = "^1.0.0"

[tool.mypy]
python_version = "3.10"
strict = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["tests.*", "tests.*.*"]
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ai", "ai.*", "email_clients", "email_clients.*"]
ignore_errors = true

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--cov=src --cov-report=term-missing --cov-report=xml --disable-socket"
markers = [
    "live: tests that require live Ollama and/or IMAP services",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
